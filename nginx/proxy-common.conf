# Shared upstream settings, included by every /api/* location.
# (Declared per-location because a location's own proxy_set_header
# replaces — rather than extends — headers inherited from the server block.)
proxy_ssl_server_name on;
proxy_http_version 1.1;
# Strip browser context so providers see a server-side request
# (NewsAPI's free plan rejects requests carrying a browser Origin).
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
proxy_connect_timeout 10s;
proxy_read_timeout 20s;
